<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Build Logic</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #121214; color: #fff; padding: 20px; margin: 0; }
        .container { max-width: 450px; margin: 40px auto; background: #1a1a24; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        input[type="text"] { width: 90%; padding: 12px; margin: 15px 0; border-radius: 6px; border: 2px solid #333; background: #222; color: #fff; font-size: 16px; text-align: center; }
        input[type="text"]:focus { border-color: #2980b9; outline: none; }
        .pins-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 25px 0; }
        
        /* Estado Apagado (0) */
        .pin-btn { background: #2c2c38; border: 2px solid #3e3e50; color: #b5b5c3; padding: 18px 0; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
        
        /* Estado Encendido (1) - ¡Activación forzada! */
        .pin-btn.active { background: #27ae60 !important; border-color: #2ecc71 !important; color: #fff !important; box-shadow: 0 0 12px rgba(46,204,113,0.4); }
        
        button.submit-btn { background: #2980b9; color: white; padding: 14px 0; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 96%; margin-top: 10px; transition: background 0.2s; }
        button.submit-btn:hover { background: #3498db; }
        h2 { margin-top: 0; color: #3498db; }
        p { color: #63637b; font-size: 14px; margin-bottom: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>BUILD LOGIC! PANEL</h2>
        <p>Configura tus datos para el HTTP Transmitter</p>
        
        <label style="font-weight: bold; color: #e1e1e6; display: block; margin-bottom: 5px;">SYSTEM SID</label>
        <input type="text" id="sid" placeholder="Escribe tu SID secreto..." required>
        
        <div class="pins-grid">
            <button type="button" class="pin-btn" onclick="togglePin(0)">P0</button>
            <button type="button" class="pin-btn" onclick="togglePin(1)">P1</button>
            <button type="button" class="pin-btn" onclick="togglePin(2)">P2</button>
            <button type="button" class="pin-btn" onclick="togglePin(3)">P3</button>
            <button type="button" class="pin-btn" onclick="togglePin(4)">P4</button>
            <button type="button" class="pin-btn" onclick="togglePin(5)">P5</button>
            <button type="button" class="pin-btn" onclick="togglePin(6)">P6</button>
            <button type="button" class="pin-btn" onclick="togglePin(7)">P7</button>
        </div>

        <button type="button" class="submit-btn" onclick="enviarConfiguracion()">ACTUALIZAR SERVIDOR</button>
    </div>

    <script>
        let pines = [0, 0, 0, 0, 0, 0, 0, 0];

        function togglePin(index) {
            // Alternar valor lógico entre 0 y 1
            pines[index] = pines[index] === 0 ? 1 : 0;
            
            // Forzar alteración de estilos CSS en tiempo real
            const btn = document.getElementsByClassName('pin-btn')[index];
            if (pines[index] === 1) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
            console.log("Pines lógicos actuales:", pines);
        }

        function enviarConfiguracion() {
            const sidValue = document.getElementById('sid').value;
            if(!sidValue) { alert("Por favor escribe un SID primero."); return; }

            const datosAEnviar = { 
                sid: sidValue, 
                data: pines 
            };

            fetch('/actualizar-pines', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                // Forzar codificación en texto plano JSON estructurado contra el error 400
                body: JSON.stringify(datosAEnviar)
            })
            .then(res => {
                if (!res.ok) throw new Error("Fallo en la comunicación. Código: " + res.status);
                return res.json();
            })
            .then(data => {
                if(data.success) {
                    alert(data.message); // Dispara la alerta visual nativa del navegador
                } else {
                    alert("Error interno: " + data.error);
                }
            })
            .catch(err => alert("Error al transmitir los datos al servidor: " + err.message));
        }
    </script>
</body>
</html>
